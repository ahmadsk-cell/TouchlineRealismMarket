; TouchlineRealismMarket -- configuration
; Compatible with Football Life 2026 v1.4 (FL_2026.exe / PES2021.exe)
; and Football Life 2027 (FL_2027.exe).
;
; You can edit this file while the game is running -- changes take effect
; within a couple of seconds on the Master League screens (no restart needed).

[transfer_realism]
; Mode:
;   profiles  = Realistic AI transfer rules + Club transfer profiles + Nationality policies (default)
;   realistic = Realistic AI transfer rules only (ages, club-level targeting, free agents,
;               GK cap, older-player value decay) without editing club profiles
;   off       = Restore the game's original transfer rules and club profiles
mode = profiles

; Maximum goalkeepers an AI club may hold before new GK signings are vetoed
; (active in profiles and realistic modes). Set to 0 to disable.
gk_cap = 5

; Age from which older players' database value anchors decay using the game's
; age-aware formula (active in profiles and realistic modes). Set to 0 to disable.
older_value_age = 31

; Club nationality policies (active in profiles mode; always ignored if you
; manage that club yourself).
; Format: space-separated team_id:nation_id[,nation_id,nation_id] (up to 24 clubs).
; Default: 258:236 (Athletic Bilbao = Spanish players only). Leave blank to disable.
nationality_rules = 258:236

[market_value]
; Optional global market value & transfer fee scale, in thousandths
; (1000 = the game's own 2020 economy, untouched):
;   300  = 1990s (x0.3)
;   500  = 2000s (x0.5)
;   750  = 2010s (x0.75)
;   1000 = Game default (2020, x1.0)
;   2200 = Modern (2026, x2.2)
; Any integer from 100 (x0.1) to 5000 (x5.0) is accepted.
multiplier = 1000

; Scale AI club fee ceilings and the deal veto cap by the same multiplier
; so the AI market neither freezes nor overspends (1 = yes, 0 = no).
ceilings = 1
